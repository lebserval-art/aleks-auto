  }

  .form-field textarea { resize: none; min-height: 90px; }

  .form-field input::placeholder,
  .form-field textarea::placeholder { color: rgba(122,116,112,0.6); }

  .form-submit {
    width: 100%;
    margin-top: 8px;
  }

  .form-note {
    text-align: center;
    font-size: 0.73rem;
    color: var(--muted);
    margin-top: 14px;
  }

  /* ─── SUCCESS MESSAGE ─── */
  .form-success {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
    gap: 16px;
  }
  .success-icon { font-size: 3rem; }
  .success-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--white);
    letter-spacing: 0.04em;
  }
  .success-text { font-size: 0.9rem; color: var(--muted); }

  /* ─── LOCATIONS ─── */
  .locations { background: var(--bg); }
  .locations-header { margin-bottom: 40px; }
  .locations-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  .location-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 32px 28px;
    transition: all 0.2s;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .location-card:hover {
    background: #222;
    border-color: rgba(232,122,29,0.3);
  }
  .location-badge {
    position: absolute;
    top: 20px; right: 20px;
    background: rgba(232,122,29,0.12);
    border: 1px solid rgba(232,122,29,0.25);
    color: var(--oil);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 2px;
  }
  .location-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    color: rgba(232,122,29,0.15);
    line-height: 1;
    margin-bottom: 12px;
  }
  .location-addr {
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--white);
    margin-bottom: 12px;
    line-height: 1.35;
  }
  .location-info-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .location-info {
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .location-phone {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--oil);
    text-decoration: none;
    display: inline-block;
    margin: 12px 0 16px;
    transition: color 0.2s;
  }
  .location-phone:hover {
    color: #FFA34D;
  }
  .location-map-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .nav-map-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 4px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
  }
  .nav-map-btn-yandex {
    background: rgba(252, 63, 29, 0.1);
    border: 1px solid rgba(252, 63, 29, 0.3);
    color: #FFFFFF;
  }
  .nav-map-btn-yandex:hover {
    background: rgba(252, 63, 29, 0.25);
    border-color: #FC3F1D;
  }
  .nav-map-btn-2gis {
    background: rgba(0, 185, 86, 0.1);
    border: 1px solid rgba(0, 185, 86, 0.3);
    color: #FFFFFF;
  }
  .nav-map-btn-2gis:hover {
    background: rgba(0, 185, 86, 0.25);
    border-color: #00B956;
  }

  @media (max-width: 768px) {
    .locations-grid {
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .location-card {
      padding: 24px 20px;
    }
  }
