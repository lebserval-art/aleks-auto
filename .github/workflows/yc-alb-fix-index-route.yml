name: Yandex ALB - fix "/" AccessDenied (recon + route)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the new route (unchecked = recon only, prints current config + real --help flags, changes nothing)'
        type: boolean
        default: false

jobs:
  alb-index-route:
    runs-on: ubuntu-latest
    steps:
      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Authenticate
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' > /tmp/yc-key.json
          yc config set service-account-key /tmp/yc-key.json
          yc config set folder-id b1g6ldfnpoe441qs0o3m
          rm -f /tmp/yc-key.json

      - name: Recon — yc alb virtual-host --help (full subcommand list)
        continue-on-error: true
        run: yc alb virtual-host --help

      - name: Recon — yc alb http-router list
        continue-on-error: true
        run: yc alb http-router list

      - name: Recon — yc alb virtual-host list (scoped to aleks-auto-router)
        continue-on-error: true
        run: yc alb virtual-host list --http-router-name aleks-auto-router

      - name: Recon — current aleks-auto-vh config incl. full route list/order
        continue-on-error: true
        run: yc alb virtual-host get aleks-auto-vh --http-router-name aleks-auto-router --format json

      - name: Recon — append-http-route --help (route ordering / priority flags?)
        continue-on-error: true
        run: yc alb virtual-host append-http-route --help

      - name: Recon — update-http-route --help (if it exists, may control order)
        continue-on-error: true
        run: yc alb virtual-host update-http-route --help

      - name: Recon — remove-http-route --help (if it exists)
        continue-on-error: true
        run: yc alb virtual-host remove-http-route --help

      - name: Baseline — response before apply
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://aleks-auto.com/ || echo "000")
          echo "HTTP status for https://aleks-auto.com/ (before): $code"

      - name: Apply — prepend exact-match "/" route ahead of the existing prefix-match route
        if: ${{ inputs.apply }}
        run: |
          yc alb virtual-host prepend-http-route index-exact \
            --http-router-name aleks-auto-router \
            --virtual-host-name aleks-auto-vh \
            --exact-path-match / \
            --path-prefix-rewrite /index.html \
            --backend-group-name aleks-auto-bg

      - name: Verify — response after apply must be 200
        if: ${{ inputs.apply }}
        run: |
          sleep 15
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://aleks-auto.com/ || echo "000")
          echo "HTTP status for https://aleks-auto.com/ (after): $code"
          if [ "$code" != "200" ]; then
            echo "::error::Expected 200 after applying the route, got $code"
            exit 1
          fi
